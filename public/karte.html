<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- OSM-Kachelserver verlangen einen Referer. Nur die Herkunft (Domain) wird gesendet, nie der Link mit Schlüssel. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Einsatzkarte · Wunschlos Pflege</title>
<link rel="icon" href="/icon.png" type="image/png">
<!-- Leaflet liegt lokal (public/vendor) – kein CDN, das von Firewall/Werbeblocker gesperrt werden kann. -->
<link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.css">
<script src="/vendor/leaflet-1.9.4/leaflet.js"></script>
<style>
  :root{--blau:#1d4ed8;--grau:#6b7280;--rand:#e5e7eb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111827;background:#f9fafb}
  body{display:flex;flex-direction:column;min-height:100%}
  header{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--rand)}
  header h1{margin:0;font-size:16px}
  header .info{color:var(--grau);font-size:13px;display:flex;align-items:center;gap:10px}
  #stand.hinweis{color:#92400e}
  button{font:inherit;padding:6px 12px;border:0;border-radius:8px;background:var(--blau);color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .layout{flex:1 1 auto;display:flex;min-height:0;position:relative}
  #map{flex:1;min-width:0;min-height:300px;background:#e5e7eb}
  aside{width:300px;background:#fff;border-left:1px solid var(--rand);overflow-y:auto}
  .ma{display:block;width:100%;text-align:left;background:none;color:inherit;border:0;border-bottom:1px solid var(--rand);border-radius:0;padding:10px 14px;cursor:pointer}
  .ma:hover{background:#f3f4f6}
  .ma b{display:flex;align-items:center;gap:8px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%}
  .ma .txt{color:#4b5563}
  .warn{margin:12px;padding:10px;border-radius:10px;background:#fffbeb;color:#92400e;font-size:13px}
  .info-box{margin:12px;padding:10px;border-radius:10px;background:#eff6ff;color:#1e3a8a;font-size:13px}
  .leer{padding:14px;color:var(--grau)}
  /* Hinweis über der Karte (z. B. Kartenhintergrund nicht erreichbar) – Liste bleibt nutzbar */
  #kartenHinweis{display:none;position:absolute;left:12px;right:12px;top:12px;z-index:1000;max-width:460px;padding:10px 12px;border-radius:10px;background:#fffbeb;color:#92400e;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  /* Lade-Overlay */
  #laden{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1500;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.92);transition:opacity .3s ease}
  #laden.weg{opacity:0;pointer-events:none}
  .spinner{width:44px;height:44px;border:4px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:dreh 1s linear infinite;margin-bottom:14px}
  @keyframes dreh{to{transform:rotate(360deg)}}
  #ladenText{color:#64748b;font-weight:500;text-align:center;padding:0 16px}
  /* Sperrhinweis bei ungültigem Link */
  #gesperrt{position:fixed;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:#f9fafb;z-index:2000}
  #gesperrt div{background:#fff;padding:22px;border-radius:14px;width:92%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.15);text-align:center}
  /* PKW-Marker */
  .wl-auto-icon{background:none;border:0}
  .wl-auto{position:relative;width:44px;height:60px}
  .wl-auto-body{width:44px;height:44px;transition:transform .8s ease}
  .wl-auto-label{position:absolute;left:50%;top:44px;transform:translateX(-50%);color:#fff;font-weight:600;font-size:11px;line-height:1;padding:3px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .leaflet-marker-icon.wl-auto-icon{transition:transform .8s linear}
  @media (prefers-reduced-motion:reduce){.wl-auto-body,.leaflet-marker-icon.wl-auto-icon,.spinner{transition:none;animation:none}}
  @media (max-width:760px){.layout{flex-direction:column}aside{width:auto;max-height:40%;border-left:0;border-top:1px solid var(--rand)}}
</style>
</head>
<body>
<header>
  <h1>🗺️ Einsatzkarte <span id="datum" style="font-weight:400;color:var(--grau)"></span></h1>
  <div class="info">
    <span id="stand"></span>
    <button id="reload" type="button">Aktualisieren</button>
  </div>
</header>
<div class="layout">
  <div id="map"></div>
  <div id="kartenHinweis"></div>
  <aside id="liste"><div class="leer">Lade Tagesplan …</div></aside>
</div>

<div id="laden">
  <div class="spinner"></div>
  <div id="ladenText">Einsatzkarte wird geladen …</div>
</div>

<div id="gesperrt">
  <div>
    <div style="font-weight:700;font-size:16px">Link ungültig</div>
    <div style="color:var(--grau);margin-top:6px">Bitte die Einsatzkarte über den Button im Airtable-Interface „Wunschlos Büro" öffnen.</div>
  </div>
</div>

<script>
(function () {
  'use strict';
  // Schlüssel kommt ausschließlich aus dem Link des Airtable-Interface (?k=...).
  var KEY = '';
  try { KEY = new URLSearchParams(location.search).get('k') || ''; }
  catch (e) { var km = /[?&]k=([^&#]*)/.exec(location.search); KEY = km ? decodeURIComponent(km[1]) : ''; }

  var TICK_MS = 30000, RELOAD_MS = 10 * 60000, FETCH_TIMEOUT_MS = 20000;
  var RETRY_S = [15, 30, 60, 120];          // automatische Wiederholung bei Netzproblemen
  var FALLBACK_CENTER = [48.62, 9.83];

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var fmt = function (min) { return pad(Math.floor(min / 60)) + ':' + pad(Math.round(min % 60)); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  // --- Fehler melden (E-Mail-Alarm über /api/report-error), je Art nur einmal pro Seitenaufruf.
  // Es wird nie der Link/Schlüssel oder Klientendaten übertragen.
  var gemeldet = {};
  function melde(art, nachricht) {
    if (gemeldet[art]) return; gemeldet[art] = true;
    try {
      fetch('/api/report-error', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
        body: JSON.stringify({ source: 'karte.html/' + art, message: String(nachricht || '').slice(0, 500),
          context: { ua: navigator.userAgent, online: navigator.onLine } })
      }).catch(function () {});
    } catch (e) {}
  }
  window.addEventListener('error', function (ev) { melde('js', (ev && ev.message) || 'unbekannter Fehler'); });
  window.addEventListener('unhandledrejection', function (ev) { melde('promise', ev && ev.reason && (ev.reason.message || ev.reason)); });

  // --- Uhrzeit immer in deutscher Zeit (auch wenn der PC anders eingestellt ist)
  var berlinFmt = null;
  try { berlinFmt = new Intl.DateTimeFormat('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); } catch (e) {}
  function jetztMin() {
    var d = new Date();
    if (berlinFmt && berlinFmt.formatToParts) {
      try {
        var p = {}; berlinFmt.formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
        var h = Number(p.hour) % 24, mi = Number(p.minute), s = Number(p.second);
        if (!isNaN(h) && !isNaN(mi)) return h * 60 + mi + (isNaN(s) ? 0 : s / 60);
      } catch (e) {}
    }
    return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  }
  function datumText(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    if (!m) return '';
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12);
    var wt = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][d.getDay()];
    return wt + ', ' + m[3] + '.' + m[2] + '.';
  }
  function uhrText() {
    var d = new Date();
    try { return d.toLocaleTimeString('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  }

  function bearing(a, b) {
    var r = Math.PI / 180, f1 = a.lat * r, f2 = b.lat * r, dl = (b.lng - a.lng) * r;
    var y = Math.sin(dl) * Math.cos(f2), x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
    return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
  }

  // Position eines Mitarbeiters zur Minute t – nur Einsätze mit Koordinaten zählen.
  function positionFuer(ma, t) {
    var es = (ma.einsaetze || []).filter(function (e) { return e.lat != null && e.lng != null; });
    if (!es.length) return null;
    var erster = es[0], letzter = es[es.length - 1];
    if (t < erster.start) return { lat: erster.lat, lng: erster.lng, heading: 0, phase: 'vor', naechster: erster, text: 'Erster Einsatz ' + fmt(erster.start) + ' Uhr · ' + erster.klient };
    for (var i = 0; i < es.length; i++) {
      var e = es[i], next = es[i + 1];
      if (t >= e.start && t <= e.ende) return { lat: e.lat, lng: e.lng, heading: next ? bearing(e, next) : 0, phase: 'beim', aktueller: e, naechster: next, text: 'Beim Klienten · ' + e.klient + ' (bis ' + fmt(e.ende) + ' Uhr)' };
      if (next && t > e.ende && t < next.start) {
        var p = Math.min(1, Math.max(0, (t - e.ende) / Math.max(1, next.start - e.ende)));
        return { lat: e.lat + (next.lat - e.lat) * p, lng: e.lng + (next.lng - e.lng) * p, heading: bearing(e, next), phase: 'fahrt', naechster: next, text: 'Unterwegs zu ' + next.klient + ' (' + fmt(next.start) + ' Uhr)' };
      }
    }
    return { lat: letzter.lat, lng: letzter.lng, heading: 0, phase: 'nach', text: 'Feierabend · zuletzt bei ' + letzter.klient + ' bis ' + fmt(letzter.ende) + ' Uhr' };
  }

  // „Plastischer" PKW von oben, Front oben (0° = Norden).
  function autoSvg(farbe, uid) {
    return '<svg viewBox="0 0 64 64" width="44" height="44" xmlns="http://www.w3.org/2000/svg">'
      + '<defs><linearGradient id="g' + uid + '" x1="0" y1="0" x2="1" y2="0">'
      + '<stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".35" stop-color="#fff" stop-opacity=".45"/>'
      + '<stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs>'
      + '<ellipse cx="34" cy="35" rx="15" ry="26" fill="#000" opacity=".22"/>'
      + '<rect x="11" y="13" width="7" height="12" rx="2.5" fill="#1a1a1a"/><rect x="46" y="13" width="7" height="12" rx="2.5" fill="#1a1a1a"/>'
      + '<rect x="11" y="40" width="7" height="12" rx="2.5" fill="#1a1a1a"/><rect x="46" y="40" width="7" height="12" rx="2.5" fill="#1a1a1a"/>'
      + '<path d="M20 7 Q32 2 44 7 L47 22 L47 56 Q32 61 17 56 L17 22 Z" fill="' + farbe + '" stroke="#000" stroke-opacity=".25"/>'
      + '<path d="M20 7 Q32 2 44 7 L47 22 L47 56 Q32 61 17 56 L17 22 Z" fill="url(#g' + uid + ')"/>'
      + '<path d="M22 19 Q32 15 42 19 L43 27 L21 27 Z" fill="#bfe3ff" opacity=".9"/>'
      + '<path d="M21 29 L43 29 L42 42 Q32 45 22 42 Z" fill="#111827" opacity=".85"/>'
      + '<path d="M22 44 Q32 47 42 44 L42 49 Q32 51 22 49 Z" fill="#bfe3ff" opacity=".7"/>'
      + '<circle cx="22" cy="8.5" r="2.3" fill="#fff8c2"/><circle cx="42" cy="8.5" r="2.3" fill="#fff8c2"/>'
      + '<rect x="19" y="54" width="6" height="2.6" rx="1" fill="#ff3b30"/><rect x="39" y="54" width="6" height="2.6" rx="1" fill="#ff3b30"/>'
      + '</svg>';
  }

  function autoIcon(ma, pos) {
    var uid = String(ma.id).replace(/[^A-Za-z0-9]/g, '');
    var fade = pos.phase === 'vor' || pos.phase === 'nach' ? 'opacity:.55;' : '';
    var html = '<div class="wl-auto" style="' + fade + '"><div class="wl-auto-body" style="transform:rotate(' + pos.heading.toFixed(0) + 'deg)">'
      + autoSvg(ma.farbe, uid) + '</div><div class="wl-auto-label" style="background:' + ma.farbe + '">' + esc(String(ma.name).split(' ')[0]) + '</div></div>';
    return L.divIcon({ html: html, className: 'wl-auto-icon', iconSize: [44, 60], iconAnchor: [22, 22], popupAnchor: [0, -20] });
  }

  function popupHtml(ma, pos) {
    var zeilen = (ma.einsaetze || []).map(function (e) {
      var aktiv = pos.aktueller && pos.aktueller.id === e.id;
      var ohne = e.lat == null ? ' <span style="color:#b91c1c">⚠ ohne Standort</span>' : '';
      return '<div style="' + (aktiv ? 'font-weight:600' : '') + '">' + fmt(e.start) + '–' + fmt(e.ende) + ' · ' + esc(e.klient) + ohne + '</div>';
    }).join('');
    return '<div style="min-width:220px;font-size:13px;line-height:1.4"><div style="font-weight:700;font-size:15px;color:' + ma.farbe + '">'
      + esc(ma.name) + (ma.fahrzeug ? ' · ' + esc(ma.fahrzeug) : '') + '</div><div style="margin:4px 0 8px">' + esc(pos.text)
      + '</div><div style="border-top:1px solid #e5e7eb;padding-top:6px">' + zeilen + '</div></div>';
  }

  // --- Overlay / Hinweise --------------------------------------------------
  var overlayZu = false;
  function overlayAus() {
    if (overlayZu) return; overlayZu = true;
    var o = $('laden'); o.className = 'weg';
    setTimeout(function () { o.style.display = 'none'; }, 350);
  }
  // Dauert der erste Abruf länger: beruhigender Text statt Fehlermeldung.
  setTimeout(function () { if (!overlayZu) $('ladenText').textContent = 'Verbindung wird aufgebaut – das dauert einen Moment …'; }, 8000);

  function kartenHinweis(text) {
    var h = $('kartenHinweis');
    if (text) { h.textContent = text; h.style.display = 'block'; } else { h.style.display = 'none'; }
  }

  // --- Karte -----------------------------------------------------------------
  var map = null;
  try {
    if (typeof L === 'undefined') throw new Error('Leaflet nicht geladen');
    map = L.map('map').setView(FALLBACK_CENTER, 12);
    var kachelFehler = 0, kachelOk = 0;
    var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      referrerPolicy: 'strict-origin-when-cross-origin', // Pflicht laut OSM-Richtlinie; sendet nur die Domain
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende'
    }).addTo(map);
    tiles.on('tileload', function () { kachelOk++; if (kachelOk === 1) kartenHinweis(''); });
    tiles.on('tileerror', function () {
      kachelFehler++;
      if (kachelFehler >= 6 && kachelOk === 0) {
        kartenHinweis('Der Kartenhintergrund ist gerade nicht erreichbar. Die Fahrzeuge und die Liste rechts sind trotzdem aktuell.');
        melde('kacheln', 'OSM-Kacheln laden nicht (' + kachelFehler + ' Fehler)');
      }
    });
    window.addEventListener('resize', function () { try { map.invalidateSize(); } catch (e) {} });
    setTimeout(function () { try { map.invalidateSize(); } catch (e) {} }, 300);
  } catch (e) {
    map = null;
    kartenHinweis('Die Kartenansicht konnte in diesem Browser nicht gestartet werden. Die Liste rechts zeigt alle Mitarbeiter. Bitte Seite neu laden (F5).');
    melde('leaflet', e && e.message);
  }

  var daten = null, fitDone = false, route = null;
  var marker = {};

  function zeigeRoute(ma) {
    if (!map) return;
    if (route) { route.remove(); route = null; }
    var pts = (ma.einsaetze || []).filter(function (e) { return e.lat != null; }).map(function (e) { return [e.lat, e.lng]; });
    if (pts.length >= 2) route = L.polyline(pts, { color: ma.farbe, weight: 3, opacity: .6, dashArray: '6 8' }).addTo(map);
  }

  function springeZu(ma) {
    var m = marker[ma.id]; if (!m || !map) return;
    map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 14), { duration: .8 });
    m.openPopup(); zeigeRoute(ma);
  }

  function renderKarte(positionen) {
    if (!map) return;
    var seen = {};
    positionen.forEach(function (x) {
      var ma = x.ma, pos = x.pos;
      seen[ma.id] = true;
      var m = marker[ma.id];
      if (!m) {
        m = L.marker([pos.lat, pos.lng], { icon: autoIcon(ma, pos), zIndexOffset: 500 }).addTo(map);
        m.on('click', function () { zeigeRoute(ma); });
        marker[ma.id] = m;
      } else { m.setLatLng([pos.lat, pos.lng]); m.setIcon(autoIcon(ma, pos)); }
      m.bindPopup(popupHtml(ma, pos), { maxWidth: 320 });
    });
    Object.keys(marker).forEach(function (id) { if (!seen[id]) { marker[id].remove(); delete marker[id]; } });

    if (!fitDone) {
      var pts = [];
      daten.mitarbeiter.forEach(function (ma) { (ma.einsaetze || []).forEach(function (e) { if (e.lat != null) pts.push([e.lat, e.lng]); }); });
      if (pts.length) { map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 14 }); fitDone = true; }
    }
  }

  function renderListe(positionen) {
    var liste = $('liste'); liste.innerHTML = '';
    if (!daten.mitarbeiter.length) liste.innerHTML = '<div class="leer">Heute sind keine Einsätze geplant.</div>';
    positionen.forEach(function (x) {
      var ma = x.ma, pos = x.pos;
      var b = document.createElement('button'); b.className = 'ma'; b.type = 'button';
      b.innerHTML = '<b><span class="dot" style="background:' + ma.farbe + '"></span>' + esc(ma.name)
        + (ma.fahrzeug ? ' <span style="font-weight:400;color:#6b7280">· ' + esc(ma.fahrzeug) + '</span>' : '') + '</b><div class="txt">' + esc(pos.text) + '</div>';
      b.onclick = function () { springeZu(ma); }; liste.appendChild(b);
    });
    daten.mitarbeiter.forEach(function (ma) {
      if (positionen.some(function (p) { return p.ma.id === ma.id; })) return;
      var d = document.createElement('div'); d.className = 'ma'; d.style.color = '#6b7280';
      d.innerHTML = '<span class="dot" style="background:' + ma.farbe + ';margin-right:8px"></span>' + esc(ma.name) + ': Einsätze ohne Standort'; liste.appendChild(d);
    });
    var ohne = daten.ohneStandort || [];
    if (ohne.length) {
      var w = document.createElement('div'); w.className = 'warn';
      w.innerHTML = '<b>⚠ Ohne Standort (' + ohne.length + ')</b><br>'
        + ohne.map(function (o) { return fmt(o.start) + ' · ' + esc(o.klient) + ' (' + esc(o.mitarbeiter) + ')' + (o.adresse ? '' : ' – keine Anschrift'); }).join('<br>')
        + '<div style="margin-top:6px;font-size:12px">Anschrift auf der Seite „Klienten" prüfen; die Karte ergänzt den Standort automatisch.</div>';
      liste.appendChild(w);
    }
  }

  function render() {
    if (!daten) return;
    try {
      var t = jetztMin();
      var positionen = daten.mitarbeiter.map(function (ma) { return { ma: ma, pos: positionFuer(ma, t) }; }).filter(function (x) { return x.pos; });
      renderKarte(positionen);
      renderListe(positionen);
    } catch (e) {
      melde('render', e && e.message);
    }
  }

  // --- Laden -------------------------------------------------------------------
  function sperren() { overlayAus(); $('gesperrt').style.display = 'flex'; }

  function holen(url, opts, ms) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    if (ctl) opts.signal = ctl.signal;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, ms);
    return fetch(url, opts).then(function (r) { clearTimeout(timer); return r; }, function (e) { clearTimeout(timer); throw e; });
  }

  var laeuft = false, fehlversuche = 0, retryTimer = null, letzterLauf = 0;

  function planeWiederholung() {
    var s = RETRY_S[Math.min(fehlversuche - 1, RETRY_S.length - 1)];
    clearTimeout(retryTimer);
    retryTimer = setTimeout(laden, s * 1000);
    var st = $('stand'); st.className = 'hinweis';
    st.textContent = daten
      ? 'Stand ' + (st.getAttribute('data-uhr') || '') + ' · Verbindung wird automatisch erneuert …'
      : 'Verbindung wird automatisch erneuert …';
    if (!daten) {
      $('liste').innerHTML = '<div class="info-box">Der Tagesplan wird gerade geladen. Die Seite versucht es automatisch erneut – Sie müssen nichts tun.</div>';
      overlayAus();
    }
  }

  function laden() {
    if (!KEY) { sperren(); return; }
    if (laeuft) return;
    laeuft = true; letzterLauf = Date.now();
    clearTimeout(retryTimer);
    $('reload').disabled = true;
    holen('/api/einsatz-karte', { headers: { 'X-Karte-Key': KEY }, cache: 'no-store' }, FETCH_TIMEOUT_MS)
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; });
      })
      .then(function (x) {
        if (x.r.status === 401) { sperren(); return; }
        if (!x.r.ok || x.j.status !== 'success' || !Array.isArray(x.j.mitarbeiter)) {
          throw new Error('Server ' + x.r.status + (x.j && x.j.message ? ': ' + x.j.message : ''));
        }
        daten = x.j;
        if (!Array.isArray(daten.ohneStandort)) daten.ohneStandort = [];
        fehlversuche = 0;
        $('datum').textContent = datumText(daten.datum);
        var uhr = uhrText(), st = $('stand');
        st.className = ''; st.setAttribute('data-uhr', uhr); st.textContent = 'Stand ' + uhr;
        render();
        overlayAus();
      })
      .catch(function (e) {
        fehlversuche++;
        // Erst nach mehreren Fehlversuchen alarmieren – einzelne Netz-Aussetzer sind normal.
        if (fehlversuche >= 3) melde('laden', (e && e.message) || 'Abruf fehlgeschlagen');
        planeWiederholung();
      })
      .then(function () { laeuft = false; $('reload').disabled = false; });
  }

  $('reload').addEventListener('click', laden);
  // Zurück im Tab / wieder online: frisch laden (höchstens einmal pro Minute).
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - letzterLauf > 60000) laden();
  });
  window.addEventListener('online', laden);

  setInterval(render, TICK_MS);
  setInterval(laden, RELOAD_MS);
  laden();
})();
</script>
</body>
</html>
