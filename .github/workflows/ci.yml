name: CI

# Prüft bei jedem Push/PR, dass die App fehlerfrei typisiert und baut.
# Verhindert, dass ein TypeScript-Fehler oder kaputter Build live auf Vercel geht.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript-Prüfung
        run: npm run typecheck

      - name: Produktions-Build
        run: npm run build
